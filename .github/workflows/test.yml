name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===== Python 测试 =====
  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff (non-blocking)
        run: ruff check quant_data_sdk/ || true
        continue-on-error: true

      - name: Test with pytest
        run: pytest tests/ -v --cov=quant_data_sdk --cov-report=term-missing

  # ===== JavaScript 测试 =====
  test-javascript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: javascript/package-lock.json

      - name: Install dependencies
        working-directory: javascript
        run: npm ci

      - name: Build (TypeScript compile)
        working-directory: javascript
        run: npm run build

      - name: Verify dist output
        working-directory: javascript
        run: |
          ls dist/
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/client.js
          test -f dist/client.d.ts