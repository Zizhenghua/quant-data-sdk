[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zizhenghua-quant"
version = "1.2.0"
description = "Official Python SDK for Quant Data API (A-share market data)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Zizhenghua", email = "support@zizhenghua.com"}
]
keywords = ["quant", "stock", "a-share", "finance", "api", "akshare", "backtest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5.0"]
async = ["httpx>=0.25.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
all = [
    "pandas>=1.5.0",
    "httpx>=0.25.0",
]

[project.scripts]
quant-data = "quant_data_sdk.cli:main"

[project.urls]
Homepage = "https://zizhenghua.com"
Documentation = "https://zizhenghua.com/swagger-ui/index.html"
Repository = "https://github.com/Zizhenghua/quant-data-sdk"
Issues = "https://github.com/Zizhenghua/quant-data-sdk/issues"
Changelog = "https://github.com/Zizhenghua/quant-data-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["quant_data_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
ignore = [
    "FA100",
    "I001",
    "RUF013",
    "PIE790",
]